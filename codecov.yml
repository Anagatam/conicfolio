# Codecov configuration for Anagatam/conicfolio
# https://docs.codecov.com/docs/codecovyml-reference

codecov:
  require_ci_to_pass: yes
  notify:
    wait_for_ci: yes

coverage:
  precision: 2
  round: down
  range: "70...100"

  status:
    project:
      default:
        target: auto
        threshold: 1%
        informational: false
    patch:
      default:
        target: auto
        threshold: 1%

comment:
  layout: "header, diff, flags, files"
  behavior: default
  require_changes: no

ignore:
  - "tests/**/*"
  - "docs/**/*"
  - "notebooks/**/*"
